<!DOCTYPE html>
<html>
<head>
<title>Countdown</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 40px;
  }
  #pipButton {
    margin-top: 20px;
    padding: 12px 22px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>🎉 Countdown to Jan 21</h2>

<video id="pipVideo" width="300" height="150" style="background:black;" muted></video>
<br>
<button id="pipButton" onclick="enterPiP()">Open Countdown in PiP</button>

<script>
// ====== COUNTDOWN FUNCTION (Runs independently) ======
function getCountdownText() {
    const target = new Date("April 2, 2026 00:00:00").getTime();
    const now = Date.now();
    const diff = target - now;

    if (diff < 0) return "0d 0h 0m 0s";

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);

    return `${d}d ${h}h ${m}m ${s}s`;
}

// ====== UPDATE TITLE ONLY ======
function updateTitle() {
    document.title = getCountdownText();
}

// Run every second
setInterval(updateTitle, 1000);
updateTitle();


// ====== PICTURE-IN-PICTURE CODE (separate + safe) ======
const video = document.getElementById("pipVideo");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
canvas.width = 300;
canvas.height = 150;
video.srcObject = canvas.captureStream();

function updatePiP() {
    const text = getCountdownText();

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 300, 150);

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, 150, 80);
}

setInterval(updatePiP, 1000);
updatePiP();

// Start PiP only on button click (required by browser)
async function enterPiP() {
    try {
        await video.play();
        await video.requestPictureInPicture();
    } catch (e) {
        alert("PiP not supported: " + e);
    }
}
</script>

</body>
</html>
